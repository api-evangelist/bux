aid: bux
name: BUX
description: >-
  BUX is a European neobroker and mobile-first investing app operated by BUX B.V., a
  subsidiary of ABN AMRO. It lets retail investors across Europe buy and sell individual
  stocks and ETFs commission-free starting from as little as EUR 10, build automated BUX
  Investment Plans (thematic and expert-built portfolios), and earn interest on uninvested
  cash across BUX Basic, Plus, and Prime account tiers. BUX is authorised and regulated by
  the Dutch Authority for the Financial Markets (AFM), with client financial instruments and
  money held in segregated custody via ABN AMRO Clearing and deposits protected up to EUR
  100,000 under the Dutch Deposit Guarantee Scheme. BUX does not publish a public developer
  API or SDKs; this profile captures the company's identity, legal, and security posture for
  the API Evangelist network.
